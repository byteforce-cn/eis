# operations/request-withdraw.openapi.yaml — 申请 — 撤回（approval v1.0.0 加法演进）
# 遵循核心命令 API 元结构：02-operation-contract/command.openapi.yaml
openapi: 3.1.0
info:
  title: 审批域 — 申请 — 撤回
  version: 1.0.1
  description: '命令 approval.request.withdraw。

    发起方撤回（仅无人确认前；已有区块确认则拒绝）。

    事件：approval.request.withdrawn'
paths:
  /commands/approval.request.withdraw:
    post:
      operationId: withdrawRequest
      summary: 申请 — 撤回
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WithdrawRequestCommand'
      responses:
        '202':
          description: 已接受
        '400':
          description: 参数非法
        '403': APR-403-003 仅发起方可撤回
        '409':
          description: APR-409-005 已有区块确认，不可撤回 / APR-409-002 非区块流程 / EIS-409-001 幂等冲突
components:
  schemas:
    WithdrawRequestCommand:
      type: object
      required:
      - type
      - payload
      - idempotency_key
      properties:
        type:
          type: string
          const: approval.request.withdraw
        payload:
          type: object
          required:
          - request_id
          properties:
            request_id:
              type: string
              format: uuid
            reason:
              type:
              - string
              - 'null'
        idempotency_key:
          type: string
        targets:
          type: array
          items:
            type: string
            format: uuid
