# operations/submit-request.openapi.yaml — 提交审批申请（approval v1.1.0）
# 遵循核心命令 API 元结构：02-operation-contract/command.openapi.yaml
openapi: 3.1.0
info:
  title: 审批域 — 提交申请
  version: 1.1.0
  description: |
    命令 approval.request.submit：提交审批申请（operation + target）。
    事件：approval.request.submitted

paths:
  /commands/approval.request.submit:
    post:
      operationId: submitRequest
      summary: 提交审批申请
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitRequestCommand'
      responses:
        '202':
          description: 已接受
        '400':
          description: 参数非法（操作类型/目标缺失）
        '409':
          description: EIS-409-001 幂等冲突

components:
  schemas:
    SubmitRequestCommand:
      type: object
      required: [type, payload, idempotency_key]
      properties:
        type:
          type: string
          const: approval.request.submit
        payload:
          type: object
          required: [operation, target]
          properties:
            operation:
              type: string
              pattern: '^[a-z][a-z0-9_.]*$'
            target:
              type: object
              required: [type, id]
              properties:
                type:
                  type: string
                id:
                  type: string
                  format: uuid
            summary:
              type: [string, 'null']
            sections:
              type: array
              description: |
                新区块级流转（可选，加法演进）：按属主分区确认。
                区块属主权限标识 approval.section.confirm.<owner>；
                数组顺序 = 处理顺序（服务端按索引写入 step_order，确认/回写须前序就绪，规则 section_order）；
                applicable=false 表示条件不适用（state=not_applicable，不阻塞完成）。
              items:
                type: object
                required: [key, title, owner]
                properties:
                  key:
                    type: string
                    pattern: '^[a-z][a-z0-9_-]*$'
                  title:
                    type: string
                  owner:
                    type: string
                  applicable:
                    type: boolean
                    default: true
        idempotency_key:
          type: string
