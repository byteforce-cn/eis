# operations/decide.openapi.yaml — 审批决定（approval v1.0.0）
# 遵循核心命令 API 元结构：02-operation-contract/command.openapi.yaml
openapi: 3.1.0
info:
  title: 审批域 — 审批决定
  version: 1.0.0
  description: |
    命令 approval.request.decide：对审批申请作出决定。
    校验：
    - 禁止自审（规则 no_self_approval，违规码 APR-403-001；同时受核心 SoD 约束）
    - 申请必须处于 pending 状态；重复决定 → 409
    事件：approval.request.approved / approval.request.rejected

paths:
  /commands/approval.request.decide:
    post:
      operationId: decideRequest
      summary: 审批决定
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DecideCommand'
      responses:
        '202':
          description: 已接受
        '400':
          description: 参数非法（outcome 非 approve/reject 等）
        '403':
          description: APR-403-001 禁止自审 / EIS-403-001 授权拒绝
        '409':
          description: 申请已处理 / EIS-409-001 幂等冲突

components:
  schemas:
    DecideCommand:
      type: object
      required: [type, payload, idempotency_key]
      properties:
        type:
          type: string
          const: approval.request.decide
        payload:
          type: object
          required: [request_id, outcome]
          properties:
            request_id:
              type: string
              format: uuid
            outcome:
              type: string
              enum: [approve, reject]
            comment:
              type: [string, 'null']
        idempotency_key:
          type: string
        targets:
          type: array
          items:
            type: string
            format: uuid
