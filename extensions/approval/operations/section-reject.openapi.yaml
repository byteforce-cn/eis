# operations/section-reject.openapi.yaml — 区块 — 打回（approval v1.0.0 加法演进）
# 遵循核心命令 API 元结构：02-operation-contract/command.openapi.yaml
openapi: 3.1.0
info:
  title: 审批域 — 区块 — 打回
  version: 1.0.1
  description: '命令 approval.section.reject。

    打回单个区块（属主权限 approval.section.confirm.<owner>）。单据转为 rejected；

    重提时必须全部区块重新确认。

    事件：approval.section.rejected、approval.request.rejected'
paths:
  /commands/approval.section.reject:
    post:
      operationId: rejectSection
      summary: 区块 — 打回
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RejectSectionCommand'
      responses:
        '202':
          description: 已接受
        '400':
          description: 参数非法
        '403': APR-403-002 区块属主权限不匹配
        '409':
          description: APR-409-002 非区块流程 / APR-409-003 区块状态不允许打回 / EIS-409-001 幂等冲突
components:
  schemas:
    RejectSectionCommand:
      type: object
      required:
      - type
      - payload
      - idempotency_key
      properties:
        type:
          type: string
          const: approval.section.reject
        payload:
          type: object
          required:
          - section_id
          properties:
            section_id:
              type: string
              format: uuid
            comment:
              type:
              - string
              - 'null'
        idempotency_key:
          type: string
        targets:
          type: array
          items:
            type: string
            format: uuid
