# manifest.yaml — 审批域扩展（v1.1.0，骨架）
extension:
  id: "approval"
  name: "审批域扩展"
  version: "1.1.0"
  core_version: "1.0.0"

  dependencies: []
  conflicts: []

  objects:
    - name: "ApprovalRequest"
      schema: "objects/approval-request.schema.json"
    - name: "ApprovalDecision"
      schema: "objects/approval-decision.schema.json"
    - name: "ApprovalSection"
      schema: "objects/approval-section.schema.json"

  operations:
    - name: "submitRequest"
      contract: "operations/submit-request.openapi.yaml"
    - name: "decideRequest"
      contract: "operations/decide.openapi.yaml"
    - name: "confirmSection"
      contract: "operations/section-confirm.openapi.yaml"
    - name: "rejectSection"
      contract: "operations/section-reject.openapi.yaml"
    - name: "completeSection"
      contract: "operations/section-complete.openapi.yaml"
    - name: "resubmitRequest"
      contract: "operations/request-resubmit.openapi.yaml"
    - name: "withdrawRequest"
      contract: "operations/request-withdraw.openapi.yaml"

  permissions:
    - id: "approval.request.submit"
      kind: "command"
      description: "提交审批请求（可选区块模式）"
    - id: "approval.request.decide"
      kind: "command"
      description: "简单模式决定（区块模式调用会被拒绝）"
    - id: "approval.section.confirm.*"
      kind: "command"
      description: "区块属主确认/打回（动态 owner：approval.section.confirm.<owner>；reject 复用同一属主权限）"
    - id: "approval.section.complete"
      kind: "command"
      description: "system 属主自动回写确认（建号/权限分配等区块）"
    - id: "approval.request.resubmit"
      kind: "command"
      description: "发起方重提（清空全部 confirmed/rejected 区块）"
    - id: "approval.request.withdraw"
      kind: "command"
      description: "发起方撤回（仅无人确认前）"
    - id: "approval.request.read"
      kind: "read"
      description: "审批读面：列表/详情/决策/按 target 反查（非命令，不参与命令级 /check）"

  rules:
    - name: "no_self_approval"
      file: "rules/no-self-approval.yaml"
    - name: "block_readiness"
      file: "rules/block-readiness.yaml"
    - name: "section_order"
      file: "rules/section-order.yaml"
    - name: "resubmit_reset"
      file: "rules/resubmit-reset.yaml"
    - name: "withdraw_timing"
      file: "rules/withdraw-timing.yaml"

  invariants:
    - name: "禁止自审"
      expression: "decision.decider != request.requester"
    - name: "全部区块就绪 ⟺ 单据完成"
      expression: "request.status == approved implies all(section.state in (confirmed, not_applicable))"
    - name: "确认顺序受前序就绪约束"
      expression: "section.state == confirmed implies all(prior where prior.step_order < section.step_order: prior.state in (confirmed, not_applicable))"
    - name: "重提后不得存在已确认区块"
      expression: "after request.resubmit: forall(section, section.state != confirmed)"
    - name: "无人确认前可撤回"
      expression: "request.withdraw allowed iff no section.state == confirmed"
