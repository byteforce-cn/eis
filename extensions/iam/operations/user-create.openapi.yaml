openapi: 3.1.0
info:
  title: IAM - 创建用户
  version: 1.0.0
paths:
  /commands/iam.user.create:
    post:
      operationId: userCreate
      summary: 创建用户账户
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Command'
      responses:
        '202': {description: 已接受}
        '400': {description: 参数非法}
        '409': {description: IAM-409-001 用户名冲突}
components:
  schemas:
    Command:
      type: object
      required: [type, payload, idempotency_key]
      properties:
        type: {type: string, const: iam.user.create}
        payload:
          type: object
          required: [username, display_name]
          properties:
            username: {type: string, minLength: 1}
            display_name: {type: string, minLength: 1}
            org_code: {type: [string, 'null']}
            contact: {type: [object, 'null']}
        idempotency_key: {type: string, minLength: 1}
