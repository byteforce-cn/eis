openapi: 3.1.0
info:
  title: IAM - 撤销角色绑定
  version: 1.0.0
paths:
  /commands/iam.binding.revoke:
    post:
      operationId: bindingRevoke
      summary: 撤销角色绑定
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Command'
      responses:
        '202': {description: 已接受}
        '400': {description: 参数非法}
        '409': {description: 幂等冲突}
components:
  schemas:
    Command:
      type: object
      required: [type, payload, idempotency_key]
      properties:
        type: {type: string, const: iam.binding.revoke}
        payload:
          type: object
          required: [binding_id]
          properties:
            binding_id: {type: string, format: uuid}
        idempotency_key: {type: string, minLength: 1}
