openapi: 3.1.0
info:
  title: IAM - 管理员重置凭证
  version: 1.0.0
paths:
  /commands/iam.credential.reset:
    post:
      operationId: credentialReset
      summary: 管理员重置用户凭证
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Command'
      responses:
        '202': {description: 已接受}
        '400': {description: 参数非法}
        '409': {description: 幂等冲突}
components:
  schemas:
    Command:
      type: object
      required: [type, payload, idempotency_key]
      properties:
        type: {type: string, const: iam.credential.reset}
        payload:
          type: object
          required: [account_id, new_secret_hash]
          properties:
            account_id: {type: string, format: uuid}
            new_secret_hash: {type: string, writeOnly: true}
        idempotency_key: {type: string, minLength: 1}
