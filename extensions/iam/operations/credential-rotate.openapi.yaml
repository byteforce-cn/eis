openapi: 3.1.0
info:
  title: IAM - 轮换凭证
  version: 1.0.0
paths:
  /commands/iam.credential.rotate:
    post:
      operationId: credentialRotate
      summary: 本人验证旧凭证后轮换凭证
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Command'
      responses:
        '202': {description: 已接受}
        '400': {description: 旧凭证无效或参数非法}
        '409': {description: 幂等冲突}
components:
  schemas:
    Command:
      type: object
      required: [type, payload, idempotency_key]
      properties:
        type: {type: string, const: iam.credential.rotate}
        payload:
          type: object
          required: [account_id, old_secret_hash, new_secret_hash]
          properties:
            account_id: {type: string, format: uuid}
            old_secret_hash: {type: string, writeOnly: true}
            new_secret_hash: {type: string, writeOnly: true}
        idempotency_key: {type: string, minLength: 1}
