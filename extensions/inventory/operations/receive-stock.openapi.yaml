# operations/receive-stock.openapi.yaml — 收货入库（inventory v1.0.0）
# 遵循核心命令 API 元结构：02-operation-contract/command.openapi.yaml
openapi: 3.1.0
info:
  title: 库存域 — 收货入库
  version: 1.0.0
  description: |
    命令 inventory.stock.receive：收货并增加库存。
    校验：
    - quantity > 0
    - 库存非负不变量（receipt 方向恒增；issue/adjust 同规则见 rules/non-negative.yaml）

paths:
  /commands/inventory.stock.receive:
    post:
      operationId: receiveStock
      summary: 收货入库
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReceiveStockCommand'
      responses:
        '202':
          description: 已接受
        '400':
          description: 参数非法 / INV-400-001 违反库存非负
        '409':
          description: EIS-409-001 幂等冲突

components:
  schemas:
    ReceiveStockCommand:
      type: object
      required: [type, payload, idempotency_key]
      properties:
        type:
          type: string
          const: inventory.stock.receive
        payload:
          type: object
          required: [item_id, warehouse, quantity]
          properties:
            item_id:
              type: string
              format: uuid
            warehouse:
              type: string
            quantity:
              type: string
              pattern: '^\d+(\.\d+)?$'
              description: 收货数量（十进制字符串，> 0）
            reference:
              type: [string, 'null']
              description: 来源单据引用（如审批单）
        idempotency_key:
          type: string
        targets:
          type: array
          items:
            type: string
            format: uuid
