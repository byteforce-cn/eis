# operations/post-voucher.openapi.yaml — 过账（accounting v1.0.0）
# 遵循核心命令 API 元结构：02-operation-contract/command.openapi.yaml（幂等键、202/400/409）
openapi: 3.1.0
info:
  title: 会计域 — 过账
  version: 1.0.0
  description: |
    命令 accounting.voucher.post：将草稿凭证过账。
    校验（全部通过才接受）：
    - 借贷平衡（规则 double_entry，违规码 ACC-400-001）
    - 期间未锁定（规则 period_lock，违规码 ACC-409-001）
    - 幂等：同幂等键重复提交返回原结果；内容不一致 → 409（核心 EIS-409-001）

paths:
  /commands/accounting.voucher.post:
    post:
      operationId: postVoucher
      summary: 过账凭证
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostVoucherCommand'
      responses:
        '202':
          description: 已接受（返回命令 ID 与事件 ID，见核心 CommandAccepted）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Accepted'
        '400':
          description: ACC-400-001 借贷不平衡
        '409':
          description: ACC-409-001 期间已锁定 / EIS-409-001 幂等冲突

components:
  schemas:
    PostVoucherCommand:
      type: object
      required: [type, payload, idempotency_key]
      properties:
        type:
          type: string
          const: accounting.voucher.post
        payload:
          type: object
          required: [voucher_id, post_date]
          properties:
            voucher_id:
              type: string
              format: uuid
            post_date:
              type: string
              format: date
              description: 过账业务日期（决定所属会计期间）
        idempotency_key:
          type: string
        targets:
          type: array
          items:
            type: string
            format: uuid

    Accepted:
      type: object
      properties:
        command_id:
          type: string
          format: uuid
        status:
          type: string
          const: accepted
        event_ids:
          type: array
          items:
            type: string
            format: uuid
