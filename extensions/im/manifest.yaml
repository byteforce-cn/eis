# manifest.yaml — IM 协作触达层扩展（领域扩展；ADR-0012 §4.2 / ADR-0023）
extension:
  id: "im"
  name: "IM 协作触达层扩展（消息 / 群组 / 已读 / 好友黑名单）"
  version: "1.0.0"
  core_version: "1.0.0"

  dependencies: []
  conflicts: []

  objects:
    - name: "Message"
      schema: "objects/message.schema.json"
    - name: "Conversation"
      schema: "objects/conversation.schema.json"
    - name: "ReadPosition"
      schema: "objects/read-position.schema.json"
    - name: "Group"
      schema: "objects/group.schema.json"
    - name: "GroupMember"
      schema: "objects/group-member.schema.json"
    - name: "Friendship"
      schema: "objects/friendship.schema.json"
    - name: "Block"
      schema: "objects/block.schema.json"

  operations:
    - name: "messageSend"
      contract: "operations/messages.openapi.yaml"
    - name: "messageEdit"
      contract: "operations/messages.openapi.yaml"
    - name: "messageRecall"
      contract: "operations/messages.openapi.yaml"
    - name: "conversationSettingsUpdate"
      contract: "operations/conversations.openapi.yaml"
    - name: "readPositionReport"
      contract: "operations/conversations.openapi.yaml"
    - name: "groupCreate"
      contract: "operations/groups.openapi.yaml"
    - name: "groupUpdate"
      contract: "operations/groups.openapi.yaml"
    - name: "groupDissolve"
      contract: "operations/groups.openapi.yaml"
    - name: "groupMemberAdd"
      contract: "operations/group-members.openapi.yaml"
    - name: "groupMemberRemove"
      contract: "operations/group-members.openapi.yaml"
    - name: "groupMemberRoleUpdate"
      contract: "operations/group-members.openapi.yaml"
    - name: "friendRequest"
      contract: "operations/friends.openapi.yaml"
    - name: "friendRequestDecide"
      contract: "operations/friends.openapi.yaml"
    - name: "friendRemove"
      contract: "operations/friends.openapi.yaml"
    - name: "userBlock"
      contract: "operations/blocks.openapi.yaml"
    - name: "userUnblock"
      contract: "operations/blocks.openapi.yaml"
    - name: "messageRead"
      contract: "operations/reads.openapi.yaml"

  rules:
    - name: "im_message"
      file: "rules/im-message.rules.yaml"
    - name: "im_group"
      file: "rules/im-group.rules.yaml"
    - name: "im_relationship"
      file: "rules/im-relationship.rules.yaml"

  # 权限目录（ADR-0006 / extensions/README.md §7）：命令 + 读取面
  permissions:
    - id: "im.message.send"
      kind: "command"
      description: "发送消息（(chat_id, client_msg_id) 幂等）"
    - id: "im.message.edit"
      kind: "command"
      description: "编辑消息（base_version 乐观锁）"
    - id: "im.message.recall"
      kind: "command"
      description: "撤回消息（追加版本 + 审计）"
    - id: "im.conversation.settings.update"
      kind: "command"
      description: "更新会话设置（置顶/免打扰/隐藏）"
    - id: "im.read.position.report"
      kind: "command"
      description: "上报已读位点（单调推进，回退拒绝）"
    - id: "im.group.create"
      kind: "command"
      description: "建群（创建群主成员关系）"
    - id: "im.group.update"
      kind: "command"
      description: "更新群名称/头像"
    - id: "im.group.dissolve"
      kind: "command"
      description: "解散群（仅群主）"
    - id: "im.group.member.add"
      kind: "command"
      description: "加群成员"
    - id: "im.group.member.remove"
      kind: "command"
      description: "移出群/退群（墓碑 + 审计）"
    - id: "im.group.member.role.update"
      kind: "command"
      description: "改群成员角色/禁言（仅群主）"
    - id: "im.friend.request"
      kind: "command"
      description: "发起好友申请"
    - id: "im.friend.request.decide"
      kind: "command"
      description: "接受/拒绝好友申请（仅被申请人）"
    - id: "im.friend.remove"
      kind: "command"
      description: "删除好友"
    - id: "im.user.block"
      kind: "command"
      description: "拉黑用户"
    - id: "im.user.unblock"
      kind: "command"
      description: "取消拉黑"
    - id: "im.message.read"
      kind: "read"
      description: "读取消息历史/单条消息（as_of / recorded_as_of / min_version）"
    - id: "im.conversation.read"
      kind: "read"
      description: "读取会话元数据与已读位点"
    - id: "im.relationship.read"
      kind: "read"
      description: "读取群成员/好友/黑名单关系"

  invariants:
    - name: "会话内客户端消息 ID 唯一"
      expression: "unique(message.chat_id, message.client_msg_id)"
    - name: "会话内 server_seq 唯一"
      expression: "unique(message.chat_id, message.server_seq)"
    - name: "撤回必须有撤回时间与操作者"
      expression: "message.status == recalled implies message.recalled_at is not null and message.recalled_by is not null"
    - name: "同一群至多一个 active 群主"
      expression: "count(group_member where group_id == g.id and role == owner and left_at is null) <= 1"
    - name: "同一用户同一端已读位点唯一"
      expression: "unique(read_position.chat_id, read_position.user_id, read_position.endpoint_id)"
    - name: "同一对用户至多一个当前好友关系"
      expression: "unique(friendship.min(from_user_id, to_user_id), friendship.max(from_user_id, to_user_id))"
    - name: "同一对用户至多一个当前黑名单关系"
      expression: "unique(block.user_id, block.blocked_user_id)"
    - name: "解散必须有解散时间与操作者"
      expression: "group.status == dissolved implies group.dissolved_at is not null and group.dissolved_by is not null"
