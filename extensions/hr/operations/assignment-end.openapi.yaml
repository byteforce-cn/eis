# operations/assignment-end.openapi.yaml — 任职 — 结束（hr v1.0.0）
# 遵循核心命令 API 元结构：02-operation-contract/command.openapi.yaml
openapi: 3.1.0
info:
  title: 人力资源域 — 任职 — 结束
  version: 1.0.0
  description: 命令 hr.assignment.end：见 rules/ 与 handlers.py 的可执行语义。
paths:
  /commands/hr.assignment.end:
    post:
      operationId: assignmentEnd
      summary: 任职 — 结束
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/assignmentEndCommand'
      responses:
        '202':
          description: 已接受
        '400':
          description: HR-400-001 参数非法 / HR-404-001 任职不存在
        '409':
          description: HR-403-001 任职已结束
components:
  schemas:
    assignmentEndCommand:
      type: object
      required:
      - type
      - payload
      - idempotency_key
      properties:
        type:
          type: string
          const: hr.assignment.end
        payload:
          type: object
          required:
          - assignment_id
          properties:
            assignment_id:
              type: string
              format: uuid
            end_date:
              type:
              - string
              - 'null'
              format: date
            reason:
              type:
              - string
              - 'null'
        idempotency_key:
          type: string
        targets:
          type: array
          items:
            type: string
            format: uuid
