# operations/assignment-assign.openapi.yaml — 任职 — 分配（hr v1.1.0）
# 遵循核心命令 API 元结构：02-operation-contract/command.openapi.yaml
openapi: 3.1.0
info:
  title: 人力资源域 — 任职 — 分配
  version: 1.1.0
  description: 命令 hr.assignment.assign：见 rules/ 与 handlers.py 的可执行语义。
paths:
  /commands/hr.assignment.assign:
    post:
      operationId: assignmentAssign
      summary: 任职 — 分配
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/assignmentAssignCommand'
      responses:
        '202':
          description: 已接受
        '400':
          description: HR-400-001 参数非法 / HR-404-001 员工、岗位或组织不存在
        '409':
          description: HR-409-003 已有有效主岗 / HR-403-001 员工处于终态 / HR-409-006 岗位或组织未启用
components:
  schemas:
    assignmentAssignCommand:
      type: object
      required:
      - type
      - payload
      - idempotency_key
      properties:
        type:
          type: string
          const: hr.assignment.assign
        payload:
          type: object
          required:
          - employee_id
          - position_id
          properties:
            employee_id:
              type: string
              format: uuid
            position_id:
              type: string
              format: uuid
              description: 岗位 ID（必须启用；任职组织由岗位派生）
            is_primary:
              type: boolean
              default: false
              description: 是否主岗
            start_date:
              type:
              - string
              - 'null'
              format: date
        idempotency_key:
          type: string
        targets:
          type: array
          items:
            type: string
            format: uuid
