# operations/org-unit-define.openapi.yaml — 组织单元 — 定义（hr v1.0.0）
# 遵循核心命令 API 元结构：02-operation-contract/command.openapi.yaml
openapi: 3.1.0
info:
  title: 人力资源域 — 组织单元 — 定义
  version: 1.0.0
  description: 命令 hr.org.unit.define：见 rules/ 与 handlers.py 的可执行语义。
paths:
  /commands/hr.org.unit.define:
    post:
      operationId: orgUnitDefine
      summary: 组织单元 — 定义
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/orgUnitDefineCommand'
      responses:
        '202':
          description: 已接受
        '400':
          description: HR-400-001 参数非法 / HR-404-001 上级组织不存在
        '409':
          description: HR-409-001 组织编码已存在
components:
  schemas:
    orgUnitDefineCommand:
      type: object
      required:
      - type
      - payload
      - idempotency_key
      properties:
        type:
          type: string
          const: hr.org.unit.define
        payload:
          type: object
          required:
          - code
          - name
          - unit_type
          properties:
            code:
              type: string
              pattern: ^[A-Z0-9][A-Z0-9_-]{1,31}$
            name:
              type: string
              description: 组织名称
            unit_type:
              type: string
              enum:
              - company
              - department
              - team
            parent_id:
              type:
              - string
              - 'null'
              format: uuid
              description: 上级组织单元 ID（根组织省略或 null）
            description:
              type:
              - string
              - 'null'
        idempotency_key:
          type: string
        targets:
          type: array
          items:
            type: string
            format: uuid
