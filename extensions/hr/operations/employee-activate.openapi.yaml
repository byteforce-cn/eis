# operations/employee-activate.openapi.yaml — 员工 — 转在职（hr v1.1.0）
# 遵循核心命令 API 元结构：02-operation-contract/command.openapi.yaml
openapi: 3.1.0
info:
  title: 人力资源域 — 员工 — 转在职
  version: 1.1.0
  description: 命令 hr.employee.activate：见 rules/ 与 handlers.py 的可执行语义。
paths:
  /commands/hr.employee.activate:
    post:
      operationId: employeeActivate
      summary: 员工 — 转在职
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/employeeActivateCommand'
      responses:
        '202':
          description: 已接受
        '400':
          description: HR-400-001 参数非法 / HR-404-001 员工不存在
        '409':
          description: HR-409-004 缺少有效主岗 / HR-403-001 状态不允许转在职
components:
  schemas:
    employeeActivateCommand:
      type: object
      required:
      - type
      - payload
      - idempotency_key
      properties:
        type:
          type: string
          const: hr.employee.activate
        payload:
          type: object
          required:
          - employee_id
          properties:
            employee_id:
              type: string
              format: uuid
        idempotency_key:
          type: string
        targets:
          type: array
          items:
            type: string
            format: uuid
