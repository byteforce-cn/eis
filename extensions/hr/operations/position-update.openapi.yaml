# operations/position-update.openapi.yaml — 岗位 — 更新（hr v1.0.0）
# 遵循核心命令 API 元结构：02-operation-contract/command.openapi.yaml
openapi: 3.1.0
info:
  title: 人力资源域 — 岗位 — 更新
  version: 1.0.0
  description: 命令 hr.position.update：见 rules/ 与 handlers.py 的可执行语义。
paths:
  /commands/hr.position.update:
    post:
      operationId: positionUpdate
      summary: 岗位 — 更新
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/positionUpdateCommand'
      responses:
        '202':
          description: 已接受
        '400':
          description: HR-400-001 参数非法 / HR-404-001 岗位不存在
        '409':
          description: HR-409-005 汇报链成环
components:
  schemas:
    positionUpdateCommand:
      type: object
      required:
      - type
      - payload
      - idempotency_key
      properties:
        type:
          type: string
          const: hr.position.update
        payload:
          type: object
          required:
          - position_id
          properties:
            position_id:
              type: string
              format: uuid
            title:
              type: string
            reports_to_position_id:
              type:
              - string
              - 'null'
              format: uuid
              description: 新上级岗位 ID（必须无环）
            grade:
              type:
              - string
              - 'null'
            headcount:
              type:
              - string
              - 'null'
              pattern: ^\d+(\.\d+)?$
            status:
              type: string
              enum:
              - active
              - frozen
              - closed
        idempotency_key:
          type: string
        targets:
          type: array
          items:
            type: string
            format: uuid
