# operations/employee-cancel.openapi.yaml — 员工 — 取消入职（hr v1.1.0）
# 遵循核心命令 API 元结构：02-operation-contract/command.openapi.yaml
openapi: 3.1.0
info:
  title: 人力资源域 — 员工 — 取消入职
  version: 1.1.0
  description: 命令 hr.employee.cancel：见 rules/ 与 handlers.py 的可执行语义。
paths:
  /commands/hr.employee.cancel:
    post:
      operationId: employeeCancel
      summary: 员工 — 取消入职
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/employeeCancelCommand'
      responses:
        '202':
          description: 已接受
        '400':
          description: HR-400-001 参数非法 / HR-404-001 员工不存在
        '409':
          description: HR-403-001 仅待入职员工可取消
components:
  schemas:
    employeeCancelCommand:
      type: object
      required:
      - type
      - payload
      - idempotency_key
      properties:
        type:
          type: string
          const: hr.employee.cancel
        payload:
          type: object
          required:
          - employee_id
          properties:
            employee_id:
              type: string
              format: uuid
            reason:
              type:
              - string
              - 'null'
        idempotency_key:
          type: string
        targets:
          type: array
          items:
            type: string
            format: uuid
