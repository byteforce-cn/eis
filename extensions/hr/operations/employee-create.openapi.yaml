# operations/employee-create.openapi.yaml — 员工 — 建档（hr v1.1.0）
# 遵循核心命令 API 元结构：02-operation-contract/command.openapi.yaml
openapi: 3.1.0
info:
  title: 人力资源域 — 员工 — 建档
  version: 1.1.0
  description: 命令 hr.employee.create：见 rules/ 与 handlers.py 的可执行语义。
paths:
  /commands/hr.employee.create:
    post:
      operationId: employeeCreate
      summary: 员工 — 建档
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/employeeCreateCommand'
      responses:
        '202':
          description: 已接受
        '400':
          description: HR-400-001 参数非法 / HR-404-001 组织不存在
        '409':
          description: HR-409-002 证件散列与未终态员工重复
components:
  schemas:
    employeeCreateCommand:
      type: object
      required:
      - type
      - payload
      - idempotency_key
      properties:
        type:
          type: string
          const: hr.employee.create
        payload:
          type: object
          required:
          - name
          - hire_date
          properties:
            name:
              type: string
              description: 姓名
            hire_date:
              type: string
              format: date
            employment_type:
              type:
              - string
              - 'null'
              enum:
              - full_time
              - part_time
              - intern
              - contract
              description: 雇佣类型：全职 / 兼职 / 实习 / 劳务（可选，历史数据可空）
            work_location:
              type:
              - string
              - 'null'
              minLength: 1
              description: 工作地点（办公地 / 城市；可选，历史数据可空）
            org_unit_id:
              type:
              - string
              - 'null'
              format: uuid
              description: 主组织单元 ID（可在分配主岗后派生）
            contact:
              type:
              - string
              - 'null'
            id_type:
              type:
              - string
              - 'null'
              enum:
              - national_id
              - passport
            id_number:
              type:
              - string
              - 'null'
              minLength: 1
              writeOnly: true
              description: >-
                原始证件号（写入专用）：由域服务用注入密钥 HMAC-SHA256 派生
                id_number_hash 落库；任何响应/日志不得回显。密钥 custody 与轮换
                见 01-data-contract/write-only-fields.rules.yaml（DRV-*）。
        idempotency_key:
          type: string
        targets:
          type: array
          items:
            type: string
            format: uuid
