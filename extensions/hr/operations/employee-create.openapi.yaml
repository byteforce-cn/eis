# operations/employee-create.openapi.yaml — 员工 — 建档（hr v1.0.0）
# 遵循核心命令 API 元结构：02-operation-contract/command.openapi.yaml
openapi: 3.1.0
info:
  title: 人力资源域 — 员工 — 建档
  version: 1.0.0
  description: 命令 hr.employee.create：见 rules/ 与 handlers.py 的可执行语义。
paths:
  /commands/hr.employee.create:
    post:
      operationId: employeeCreate
      summary: 员工 — 建档
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/employeeCreateCommand'
      responses:
        '202':
          description: 已接受
        '400':
          description: HR-400-001 参数非法 / HR-404-001 组织不存在
        '409':
          description: HR-409-002 证件散列与未终态员工重复
components:
  schemas:
    employeeCreateCommand:
      type: object
      required:
      - type
      - payload
      - idempotency_key
      properties:
        type:
          type: string
          const: hr.employee.create
        payload:
          type: object
          required:
          - name
          - hire_date
          properties:
            name:
              type: string
              description: 姓名
            hire_date:
              type: string
              format: date
            org_unit_id:
              type:
              - string
              - 'null'
              format: uuid
              description: 主组织单元 ID（可在分配主岗后派生）
            contact:
              type:
              - string
              - 'null'
            id_type:
              type:
              - string
              - 'null'
              enum:
              - national_id
              - passport
            id_number_hash:
              type:
              - string
              - 'null'
              pattern: ^[0-9a-f]{64}$
              writeOnly: true
              description: 证件号 HMAC-SHA256 散列（小写十六进制 64 字符；写入专用，不落读投影）
        idempotency_key:
          type: string
        targets:
          type: array
          items:
            type: string
            format: uuid
