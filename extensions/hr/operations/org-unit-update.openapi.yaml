# operations/org-unit-update.openapi.yaml — 组织单元 — 更新（hr v1.0.0）
# 遵循核心命令 API 元结构：02-operation-contract/command.openapi.yaml
openapi: 3.1.0
info:
  title: 人力资源域 — 组织单元 — 更新
  version: 1.0.0
  description: 命令 hr.org.unit.update：见 rules/ 与 handlers.py 的可执行语义。
paths:
  /commands/hr.org.unit.update:
    post:
      operationId: orgUnitUpdate
      summary: 组织单元 — 更新
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/orgUnitUpdateCommand'
      responses:
        '202':
          description: 已接受
        '400':
          description: HR-400-001 参数非法 / HR-404-001 组织不存在
        '409':
          description: HR-409-005 组织树成环
components:
  schemas:
    orgUnitUpdateCommand:
      type: object
      required:
      - type
      - payload
      - idempotency_key
      properties:
        type:
          type: string
          const: hr.org.unit.update
        payload:
          type: object
          required:
          - unit_id
          properties:
            unit_id:
              type: string
              format: uuid
            name:
              type: string
            parent_id:
              type:
              - string
              - 'null'
              format: uuid
              description: 新上级组织单元 ID（改变组织树，必须无环）
            status:
              type: string
              enum:
              - active
              - inactive
            description:
              type:
              - string
              - 'null'
        idempotency_key:
          type: string
        targets:
          type: array
          items:
            type: string
            format: uuid
