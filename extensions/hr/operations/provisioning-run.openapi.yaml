# operations/provisioning-run.openapi.yaml — 账号供给 — 执行（system）（hr v1.0.0）
# 遵循核心命令 API 元结构：02-operation-contract/command.openapi.yaml
openapi: 3.1.0
info:
  title: 人力资源域 — 账号供给 — 执行（system）
  version: 1.0.0
  description: 命令 hr.provisioning.run：见 rules/ 与 handlers.py 的可执行语义。
paths:
  /commands/hr.provisioning.run:
    post:
      operationId: provisioningRun
      summary: 账号供给 — 执行（system）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/provisioningRunCommand'
      responses:
        '202':
          description: 已接受
        '400':
          description: HR-400-001 参数非法 / HR-404-001 员工不存在
        '409':
          description: HR-409-006 动作与员工状态不匹配
components:
  schemas:
    provisioningRunCommand:
      type: object
      required:
      - type
      - payload
      - idempotency_key
      properties:
        type:
          type: string
          const: hr.provisioning.run
        payload:
          type: object
          required:
          - employee_id
          - action
          properties:
            employee_id:
              type: string
              format: uuid
            action:
              type: string
              enum:
              - create_account
              - enable_account
              - disable_account
        idempotency_key:
          type: string
        targets:
          type: array
          items:
            type: string
            format: uuid
