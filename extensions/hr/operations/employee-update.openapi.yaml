# operations/employee-update.openapi.yaml — 员工 — 更新（hr v1.0.0）
# 遵循核心命令 API 元结构：02-operation-contract/command.openapi.yaml
openapi: 3.1.0
info:
  title: 人力资源域 — 员工 — 更新
  version: 1.0.0
  description: 命令 hr.employee.update：见 rules/ 与 handlers.py 的可执行语义。
paths:
  /commands/hr.employee.update:
    post:
      operationId: employeeUpdate
      summary: 员工 — 更新
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/employeeUpdateCommand'
      responses:
        '202':
          description: 已接受
        '400':
          description: HR-400-001 参数非法 / HR-404-001 员工或组织不存在
        '409':
          description: HR-403-001 终态员工不可更新
components:
  schemas:
    employeeUpdateCommand:
      type: object
      required:
      - type
      - payload
      - idempotency_key
      properties:
        type:
          type: string
          const: hr.employee.update
        payload:
          type: object
          required:
          - employee_id
          properties:
            employee_id:
              type: string
              format: uuid
            name:
              type: string
            contact:
              type:
              - string
              - 'null'
            org_unit_id:
              type:
              - string
              - 'null'
              format: uuid
              description: 主组织单元 ID
        idempotency_key:
          type: string
        targets:
          type: array
          items:
            type: string
            format: uuid
