# operations/position-define.openapi.yaml — 岗位 — 定义（hr v1.0.0）
# 遵循核心命令 API 元结构：02-operation-contract/command.openapi.yaml
openapi: 3.1.0
info:
  title: 人力资源域 — 岗位 — 定义
  version: 1.0.0
  description: 命令 hr.position.define：见 rules/ 与 handlers.py 的可执行语义。
paths:
  /commands/hr.position.define:
    post:
      operationId: positionDefine
      summary: 岗位 — 定义
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/positionDefineCommand'
      responses:
        '202':
          description: 已接受
        '400':
          description: HR-400-001 参数非法 / HR-404-001 组织或上级岗位不存在
        '409':
          description: HR-409-001 岗位编码已存在 / HR-409-005 汇报链成环
components:
  schemas:
    positionDefineCommand:
      type: object
      required:
      - type
      - payload
      - idempotency_key
      properties:
        type:
          type: string
          const: hr.position.define
        payload:
          type: object
          required:
          - code
          - title
          - org_unit_id
          properties:
            code:
              type: string
              pattern: ^[A-Z0-9][A-Z0-9_-]{1,31}$
            title:
              type: string
              description: 岗位名称
            org_unit_id:
              type: string
              format: uuid
              description: 所属组织单元 ID（必须存在且启用）
            reports_to_position_id:
              type:
              - string
              - 'null'
              format: uuid
              description: 上级岗位 ID
            grade:
              type:
              - string
              - 'null'
              description: 职级
            headcount:
              type:
              - string
              - 'null'
              pattern: ^\d+(\.\d+)?$
        idempotency_key:
          type: string
        targets:
          type: array
          items:
            type: string
            format: uuid
