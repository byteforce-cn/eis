# manifest.yaml — 定时任务 / 日终批处理执行语义扩展（跨域运行时；ADR-0012 §4.2 / ADR-0021）
extension:
  id: "scheduler"
  kind: "runtime"   # runtime：跨域运行时扩展，无业务对象（ADR-0021）
  name: "定时任务执行语义扩展（Job / Run / Lease）"
  version: "1.0.0"
  core_version: "1.0.0"

  dependencies: []
  conflicts: []

  # 运行时能力扩展：不定义业务对象/命令/读取面，只提供作业/运行表与规则。
  objects: []
  operations: []
  rules:
    - name: "scheduling"
      file: "rules/scheduling.rules.yaml"
  permissions: []
