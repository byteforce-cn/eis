# scenarios/procure-to-pay.yaml — 采购到付款（端到端试点，可执行版）
# 运行：tools/e2e-runner --all（或直接由参考内核执行本文件）
# 组合：approval + inventory + accounting（见 ../composition.yaml）
scenario:
  id: "procurement.procure-to-pay"
  name: "采购到付款（端到端试点）"

  authz:
    principals:
      - {id: "01900000-0000-7000-8000-000000000601", type: person, key: buyer, valid_from: "2026-01-01T00:00:00Z", recorded_at: "2026-01-01T00:00:00Z"}
      - {id: "01900000-0000-7000-8000-000000000602", type: person, key: manager, valid_from: "2026-01-01T00:00:00Z", recorded_at: "2026-01-01T00:00:00Z"}
      - {id: "01900000-0000-7000-8000-000000000603", type: person, key: storekeeper, valid_from: "2026-01-01T00:00:00Z", recorded_at: "2026-01-01T00:00:00Z"}
      - {id: "01900000-0000-7000-8000-000000000604", type: person, key: accountant, valid_from: "2026-01-01T00:00:00Z", recorded_at: "2026-01-01T00:00:00Z"}
    roles:
      - {id: "01900000-0000-7000-8000-0000000006a1", key: requester, permissions: [approval.request.submit, approval.request.decide], valid_from: "2026-01-01T00:00:00Z", recorded_at: "2026-01-01T00:00:00Z"}
      - {id: "01900000-0000-7000-8000-0000000006a2", key: approver, permissions: [approval.request.decide], valid_from: "2026-01-01T00:00:00Z", recorded_at: "2026-01-01T00:00:00Z"}
      - {id: "01900000-0000-7000-8000-0000000006a3", key: keeper, permissions: [inventory.stock.receive], valid_from: "2026-01-01T00:00:00Z", recorded_at: "2026-01-01T00:00:00Z"}
      - {id: "01900000-0000-7000-8000-0000000006a4", key: accountant, permissions: [accounting.voucher.post, accounting.period.close], valid_from: "2026-01-01T00:00:00Z", recorded_at: "2026-01-01T00:00:00Z"}
    bindings:
      - {id: "01900000-0000-7000-8000-0000000006b1", principal: "01900000-0000-7000-8000-000000000601", role: "01900000-0000-7000-8000-0000000006a1", scope: {department: D001}, valid_from: "2026-01-01T00:00:00Z", recorded_at: "2026-01-01T00:00:00Z"}
      - {id: "01900000-0000-7000-8000-0000000006b2", principal: "01900000-0000-7000-8000-000000000602", role: "01900000-0000-7000-8000-0000000006a2", scope: {department: D001}, valid_from: "2026-01-01T00:00:00Z", recorded_at: "2026-01-01T00:00:00Z"}
      - {id: "01900000-0000-7000-8000-0000000006b3", principal: "01900000-0000-7000-8000-000000000603", role: "01900000-0000-7000-8000-0000000006a3", scope: {warehouse: WH01}, valid_from: "2026-01-01T00:00:00Z", recorded_at: "2026-01-01T00:00:00Z"}
      - {id: "01900000-0000-7000-8000-0000000006b4", principal: "01900000-0000-7000-8000-000000000604", role: "01900000-0000-7000-8000-0000000006a4", scope: {organization: ORG01}, valid_from: "2026-01-01T00:00:00Z", recorded_at: "2026-01-01T00:00:00Z"}

  setup:
    ids:
      order: "01900000-0000-7000-8000-00000000d101"
      item: "01900000-0000-7000-8000-00000000d102"
      voucher_ap: "01900000-0000-7000-8000-00000000d103"
      voucher_pay: "01900000-0000-7000-8000-00000000d104"
    objects:
      # 应付发票（借：库存商品 1405 / 贷：应付账款 2202）
      - type: voucher
        id: "${ids.voucher_ap}"
        actor: "01900000-0000-7000-8000-000000000604"
        data:
          number: "记-2026-10-1001"
          voucher_date: "2026-10-05"
          status: draft
          summary: "应付发票（采购入库）"
          lines:
            - {account_code: "1405", debit: "100.00", currency: CNY}
            - {account_code: "2202", credit: "100.00", currency: CNY}
      # 付款（借：应付账款 2202 / 贷：银行存款 1002），受 SOD-002 约束
      - type: voucher
        id: "${ids.voucher_pay}"
        actor: "01900000-0000-7000-8000-000000000604"
        data:
          number: "记-2026-10-1002"
          voucher_date: "2026-10-06"
          status: draft
          summary: "付款"
          lines:
            - {account_code: "2202", debit: "100.00", currency: CNY}
            - {account_code: "1002", credit: "100.00", currency: CNY}

  steps:
    - id: S1
      actor: buyer
      command: approval.request.submit
      payload:
        operation: inventory.stock.receive
        target: {type: purchase_order, id: "${ids.order}"}
        summary: "采购收货审批"
      events: [approval.request.submitted]

    - id: S1b
      actor: buyer
      note: "负例：申请人试图自审，必须被 APR-403-001 拒绝"
      command: approval.request.decide
      payload: {request_id: "${steps.S1.created.id}", outcome: approve}
      expect_status: rejected
      expect_code: APR-403-001

    - id: S2
      actor: manager
      command: approval.request.decide
      payload: {request_id: "${steps.S1.created.id}", outcome: approve}
      events: [approval.request.approved]

    - id: S3
      actor: storekeeper
      command: inventory.stock.receive
      payload:
        item_id: "${ids.item}"
        warehouse: WH01
        quantity: "10"
        reference: "${steps.S1.created.id}"
      events: [inventory.stock.received]

    - id: S4
      actor: accountant
      note: "登记应付发票（借：库存商品，贷：应付账款）"
      command: accounting.voucher.post
      payload: {voucher_id: "${ids.voucher_ap}", post_date: "2026-10-05"}
      events: [accounting.voucher.posted]

    - id: S5
      actor: accountant
      note: "付款（借：应付，贷：银行存款）"
      command: accounting.voucher.post
      payload: {voucher_id: "${ids.voucher_pay}", post_date: "2026-10-06"}
      events: [accounting.voucher.posted]

    - id: S6
      actor: accountant
      command: accounting.period.close
      payload: {period: "2026-10"}
      events: [accounting.period.closed]

  assert:
    - {kind: audit-chain, expect: valid, min_entries: 6}
    - {kind: object-field, type: approval_request, id: "${steps.S1.created.id}", field: status, expect: approved}
    - {kind: object-field, type: voucher, id: "${ids.voucher_ap}", field: status, expect: posted}
    - {kind: object-field, type: voucher, id: "${ids.voucher_pay}", field: status, expect: posted}
    - {kind: stock, item_id: "${ids.item}", warehouse: WH01, expect: "10"}
    - {kind: balance, account_code: "1405", period: "2026-10", debit: "100.00", credit: "0.00"}
    - {kind: balance, account_code: "2202", period: "2026-10", debit: "100.00", credit: "100.00"}
    - {kind: balance, account_code: "1002", period: "2026-10", debit: "0.00", credit: "100.00"}
    - {kind: time-travel, type: voucher, id: "${ids.voucher_ap}", as_of_step: S2, expect_version: 1}
    - {kind: temporal-history, type: voucher, id: "${ids.voucher_ap}", expect_versions: 2, expect_adjacent: true}
    - {kind: idempotency, step: S4}
    - {kind: events, types: [approval.request.submitted, approval.request.approved, inventory.stock.received, accounting.voucher.posted, accounting.period.closed]}

  acceptance:
    - "借贷平衡（accounting.double_entry）阻断不平衡凭证（见 accounting 用例）"
    - "库存非负（inventory.non_negative）与数量校验通过"
    - "禁止自审（approval.no_self_approval）在 S1b 生效；SoD 由 authz 用例覆盖"
    - "审计链验证通过（S1-S6 共 6 条受理命令，链校验 ok）"
    - "双时间轴时点查询（S2 时点 v1）与版本历史（相接无重叠）正确"
