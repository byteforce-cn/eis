name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  spec:
    name: 规范与工具校验
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装依赖
        run: pip install pyyaml jsonschema
      - name: 全量校验（流水线 + 全部用例 + 试点场景）
        run: python3 tools/e2e-runner --all

  ddl:
    name: PostgreSQL DDL 冒烟
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: eis
          POSTGRES_PASSWORD: eis
          POSTGRES_DB: eis
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eis"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: eis
      PGPASSWORD: eis
      PGDATABASE: eis
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装依赖
        run: pip install pyyaml jsonschema
      - name: 编译扩展 DDL（生成物）
        run: python3 tools/schema-compiler compile --all
      - name: 执行核心 DDL
        run: |
          psql -v ON_ERROR_STOP=1 -f 01-data-contract/core.ddl
          psql -v ON_ERROR_STOP=1 -f 03-time-contract/temporal.ddl
          psql -v ON_ERROR_STOP=1 -f 05-audit-contract/audit.ddl
      - name: 执行扩展 DDL（schema-compiler 生成物）
        run: |
          for f in build/ddl/*.ddl; do
            echo "== $f"
            psql -v ON_ERROR_STOP=1 -f "$f"
          done
      - name: 执行 Outbox/Inbox 投递契约 DDL
        run: psql -v ON_ERROR_STOP=1 -f extensions/outbox/outbox.ddl
      - name: Outbox/Inbox 冒烟断言（唯一约束/状态机/租约/Inbox）
        run: psql -v ON_ERROR_STOP=1 -f tools/ci/outbox-smoke.sql
      - name: 执行查询模板（展开示例依赖扩展表）
        run: psql -v ON_ERROR_STOP=1 -f 03-time-contract/query-templates.sql
      - name: 冒烟断言（时点 / 半开区间 / append-only / 扩展函数）
        run: psql -v ON_ERROR_STOP=1 -f tools/ci/ddl-smoke.sql

  spec-pack:
    name: Spec Pack 构建与自校验
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"   # 运行产物内工具不生成 .pyc，保持 artifact 与 MANIFEST 一致
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装依赖
        run: pip install pyyaml jsonschema
      - name: 构建 spec-pack
        run: python3 tools/build-spec-pack --out dist/eis-spec-pack
      - name: 校验 MANIFEST（哈希与文件清单）
        run: python3 tools/build-spec-pack --check dist/eis-spec-pack
      - name: 产物内自校验（冻结向量 / 审计链 / 兼容性 / 契约）
        working-directory: dist/eis-spec-pack
        run: |
          python3 05-audit-contract/verify.tool --self-test
          python3 tools/audit-verifier --vector
          python3 tools/audit-verifier vectors/audit/valid.chain.json
          python3 tools/audit-verifier vectors/audit/valid-digest.chain.json --events vectors/audit/digest-events.json
          python3 tools/compatibility-checker --old vectors/evolution/schema-v1.json --new vectors/evolution/schema-v2-minor.json --standalone --fail-on MAJOR
          python3 tools/contract-checker
      - name: 上传产物（eis-spec-pack）
        uses: actions/upload-artifact@v4
        with:
          name: eis-spec-pack
          path: dist/eis-spec-pack
      - name: 安装 pnpm 与 Node
        uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: 构建 npm/pnpm 包形态
        run: python3 tools/build-spec-pack --npm-out dist/npm
      - name: 校验 npm 包 MANIFEST
        run: python3 tools/build-spec-pack --check dist/npm
      - name: Node CLI 自检（manifest / verify）
        run: |
          node dist/npm/bin/eis-spec.js manifest --json > /dev/null
          node dist/npm/bin/eis-spec.js verify --no-python
      - name: pnpm pack（归档 tarball，不发布 registry）
        working-directory: dist/npm
        run: pnpm pack --pack-destination ../npm-pack
      - name: 上传 npm 包产物（eis-spec-npm）
        uses: actions/upload-artifact@v4
        with:
          name: eis-spec-npm
          path: |
            dist/npm
            dist/npm-pack/*.tgz
