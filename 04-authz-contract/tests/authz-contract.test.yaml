# 授权契约验证用例（Spec v1.0.0）— 可执行版
# 运行：tools/e2e-runner 04-authz-contract/tests/authz-contract.test.yaml
# 夹具：04-authz-contract/tests/fixtures.yaml（时点 / 代理 / SoD）
suite: authz-contract
tests:
  - name: "角色解析必须支持时点查询（生效前拒绝）"
    kind: authz
    fixture: 04-authz-contract/tests/fixtures.yaml
    op: check
    principal: away
    permission: purchase.request.approve
    as_of: "2026-09-30T12:00:00Z"
    expect_allowed: false
    expect_code: NO_PERMISSION

  - name: "代理必须可解析（代理期内可行权）"
    kind: authz
    fixture: 04-authz-contract/tests/fixtures.yaml
    op: resolve
    principal: agent
    as_of: "2026-10-15T12:00:00Z"
    expect_roles_contains: [approver]
    expect_permissions_contains: [purchase.request.approve]

  - name: "代理期外必须拒绝"
    kind: authz
    fixture: 04-authz-contract/tests/fixtures.yaml
    op: check
    principal: agent
    permission: purchase.request.approve
    as_of: "2026-11-15T12:00:00Z"
    expect_allowed: false
    expect_code: NO_PERMISSION

  - name: "SoD 必须可检测冲突（prevent 级 → 拒绝）"
    kind: authz
    fixture: 04-authz-contract/tests/fixtures.yaml
    op: check
    principal: both
    permission: purchase.request.approve
    as_of: "2026-10-15T12:00:00Z"
    expect_allowed: false
    expect_code: SOD-001

  - name: "SoD 冲突清单必须可枚举"
    kind: authz
    fixture: 04-authz-contract/tests/fixtures.yaml
    op: sod-check
    principal: both
    as_of: "2026-10-15T12:00:00Z"
    expect_conflicts_contains: [SOD-001]

  - name: "权限检查必须返回原因（reason ≠ 空）"
    kind: authz
    fixture: 04-authz-contract/tests/fixtures.yaml
    op: check
    principal: both
    permission: purchase.request.create
    as_of: "2026-10-15T12:00:00Z"
    expect_allowed: false
    expect_code: SOD-001

  - name: "属性快照按时点选最新且新鲜（fresh）"
    kind: authz
    fixture: 04-authz-contract/tests/fixtures-attributes.yaml
    op: attributes
    principal: worker
    as_of: "2026-10-15T12:00:00Z"
    expect_attribute_state: fresh
    expect_snapshot:
      primary_position.code: P002
      primary_position.grade: M2

  - name: "属性快照过期（stale，ATR-006）"
    kind: authz
    fixture: 04-authz-contract/tests/fixtures-attributes.yaml
    op: attributes
    principal: worker
    as_of: "2026-10-25T12:00:00Z"
    expect_attribute_state: stale
    expect_reason_code: ATTRIBUTE_STALE

  - name: "无属性快照（missing，ATR-006）"
    kind: authz
    fixture: 04-authz-contract/tests/fixtures-attributes.yaml
    op: attributes
    principal: worker
    as_of: "2026-08-01T00:00:00Z"
    expect_attribute_state: missing
    expect_reason_code: ATTRIBUTE_MISSING

  - name: "声明条件匹配则允许（主岗语义，ATR-003）"
    kind: authz
    fixture: 04-authz-contract/tests/fixtures-attributes.yaml
    conditions: 04-authz-contract/tests/conditions.yaml
    op: check
    principal: worker
    permission: purchase.request.approve
    as_of: "2026-09-01T12:00:00Z"
    expect_allowed: true
    expect_attribute_state: fresh

  - name: "声明条件不匹配必须拒绝（ATTRIBUTE_MISMATCH）"
    kind: authz
    fixture: 04-authz-contract/tests/fixtures-attributes.yaml
    conditions: 04-authz-contract/tests/conditions.yaml
    op: check
    principal: worker
    permission: purchase.request.approve
    as_of: "2026-10-15T12:00:00Z"
    expect_allowed: false
    expect_code: ATTRIBUTE_MISMATCH

  - name: "声明条件在快照过期时 fail-closed（ATTRIBUTE_STALE）"
    kind: authz
    fixture: 04-authz-contract/tests/fixtures-attributes.yaml
    conditions: 04-authz-contract/tests/conditions.yaml
    op: check
    principal: worker
    permission: purchase.request.approve
    as_of: "2026-10-25T12:00:00Z"
    expect_allowed: false
    expect_code: ATTRIBUTE_STALE

  - name: "声明条件在无快照时 fail-closed（ATTRIBUTE_MISSING）"
    kind: authz
    fixture: 04-authz-contract/tests/fixtures-attributes.yaml
    conditions: 04-authz-contract/tests/conditions.yaml
    op: check
    principal: worker
    permission: purchase.request.approve
    as_of: "2026-08-01T00:00:00Z"
    expect_allowed: false
    expect_code: ATTRIBUTE_MISSING

  - name: "属主不可达（source_unavailable，ATR-006）"
    kind: authz
    fixture: 04-authz-contract/tests/fixtures-attributes.yaml
    op: attributes
    principal: outage
    as_of: "2026-10-15T12:00:00Z"
    expect_attribute_state: source_unavailable
    expect_reason_code: ATTRIBUTE_SOURCE_UNAVAILABLE

  - name: "声明条件在属主不可达时 fail-closed（ATTRIBUTE_SOURCE_UNAVAILABLE）"
    kind: authz
    fixture: 04-authz-contract/tests/fixtures-attributes.yaml
    conditions: 04-authz-contract/tests/conditions.yaml
    op: check
    principal: outage
    permission: purchase.request.approve
    as_of: "2026-10-15T12:00:00Z"
    expect_allowed: false
    expect_code: ATTRIBUTE_SOURCE_UNAVAILABLE

  - name: "any + positions[*] 任一岗位命中（ATR-003）"
    kind: authz
    fixture: 04-authz-contract/tests/fixtures-attributes.yaml
    conditions: 04-authz-contract/tests/conditions.yaml
    op: check
    principal: worker
    permission: purchase.request.approve.senior
    as_of: "2026-10-15T12:00:00Z"
    expect_allowed: true

  - name: "any 全部子句不满足则拒绝"
    kind: authz
    fixture: 04-authz-contract/tests/fixtures-attributes.yaml
    conditions: 04-authz-contract/tests/conditions.yaml
    op: check
    principal: worker
    permission: purchase.request.approve.senior
    as_of: "2026-09-01T12:00:00Z"
    expect_allowed: false
    expect_code: ATTRIBUTE_MISMATCH

  - name: "not_in 全称语义：存在任一命中即不满足"
    kind: authz
    fixture: 04-authz-contract/tests/fixtures-attributes.yaml
    conditions: 04-authz-contract/tests/conditions.yaml
    op: check
    principal: worker
    permission: purchase.request.approve.lead
    as_of: "2026-10-15T12:00:00Z"
    expect_allowed: false
    expect_code: ATTRIBUTE_MISMATCH

  - name: "not_in 全称语义：全部候选不命中则允许"
    kind: authz
    fixture: 04-authz-contract/tests/fixtures-attributes.yaml
    conditions: 04-authz-contract/tests/conditions.yaml
    op: check
    principal: worker
    permission: purchase.request.approve.lead
    as_of: "2026-09-01T12:00:00Z"
    expect_allowed: true

  - name: "未声明条件的权限不受属性缺失影响"
    kind: authz
    fixture: 04-authz-contract/tests/fixtures-attributes.yaml
    conditions: 04-authz-contract/tests/conditions.yaml
    op: check
    principal: requester
    permission: purchase.request.create
    as_of: "2026-08-01T00:00:00Z"
    expect_allowed: true

  - name: "参考内核自测（含命令级授权条件与 fail-closed）"
    kind: cli
    args: ["tools/lib/kernel.py"]
    expect_exit: 0
    stdout_contains: ["kernel 自测通过"]
